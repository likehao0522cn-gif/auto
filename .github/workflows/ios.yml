name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source revision
        run: |
          set -euo pipefail
          echo "Checked out commit: $(git rev-parse HEAD)"
          grep -q 'SPEECH_SETTINGS_2026_10_29' App/Sources/HomeView.swift

      - name: Run core tests with SwiftPM
        run: |
          set +e
          swift test 2>&1 | tee swift-test.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $TEST_EXIT_CODE

      - name: Report SwiftPM errors
        if: failure()
        run: |
          if [ -f swift-test.log ]; then
            grep -n -E 'error:' swift-test.log \
              | tail -80 \
              | while IFS= read -r line; do
                  echo "::error title=swift-test::$line"
                done
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Run unit tests
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator: $DEVICE_ID"
          set +e
          xcodebuild test \
            -project TuneMetronome.xcodeproj \
            -scheme TuneMetronome \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $TEST_EXIT_CODE

      - name: Report test errors
        if: failure()
        run: |
          if [ -f xcodebuild-test.log ]; then
            grep -n -E 'error:|The following build commands failed' xcodebuild-test.log \
              | tail -80 \
              | while IFS= read -r line; do
                  echo "::error title=xcodebuild::$line"
                done
          fi

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: xcodebuild-test.log
          if-no-files-found: ignore

      - name: Upload SwiftPM log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: ignore

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild build \
            -project TuneMetronome.xcodeproj \
            -scheme TuneMetronome \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP_PATH"
          grep -a -q 'SPEECH_SETTINGS_2026_10_29' "$APP_PATH/TuneMetronome"
          rm -rf unsigned-ipa
          mkdir -p unsigned-ipa/Payload
          cp -R "$APP_PATH" unsigned-ipa/Payload/
          cd unsigned-ipa
          zip -qry TuneMetronome-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TuneMetronome-unsigned
          path: unsigned-ipa/TuneMetronome-unsigned.ipa
          if-no-files-found: error
