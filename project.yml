name: TuneMetronome
options:
  bundleIdPrefix: com.shm06
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  TuneCore:
    type: framework
    platform: iOS
    sources:
      - path: Core/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shm06.TuneMetronome.Core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  TuneCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Core/Tests
    dependencies:
      - target: TuneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shm06.TuneMetronome.CoreTests
        GENERATE_INFOPLIST_FILE: YES
  TuneMetronome:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 璋冮煶鑺傛媿鍣?        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: 璋冮煶鑺傛媿鍣ㄩ渶瑕佷娇鐢ㄩ害鍏嬮鏉ヨ瘑鍒箰鍣ㄩ煶楂樸€傞煶棰戝彧鍦ㄨ澶囦笂鍒嗘瀽锛屼笉浼氬綍闊虫垨涓婁紶銆?        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: TuneCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shm06.TuneMetronome
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  TuneMetronome:
    build:
      targets:
        TuneMetronome: all
        TuneCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: TuneCoreTests

